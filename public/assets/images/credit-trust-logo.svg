<svg width="420" height="96" viewBox="0 0 420 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="creditTrustLogoTitle">
  <title id="creditTrustLogoTitle">Credit Trust</title>
  <defs>
    <linearGradient id="markGradient" x1="8" y1="13" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12F3D5"/>
      <stop offset="1" stop-color="#1188FF"/>
    </linearGradient>
    <linearGradient id="trustGradient" x1="240" y1="22" x2="378" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12F3D5"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.071 0 0 0 0 0.953 0 0 0 0 0.835 0 0 0 0.35 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path d="M48 10C69 10 86 27 86 48C86 69 69 86 48 86C27 86 10 69 10 48C10 27 27 10 48 10Z" stroke="url(#markGradient)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="55 14 28 11 44 14"/>
    <circle cx="48" cy="10" r="9" fill="#12F3D5"/>
    <circle cx="13" cy="48" r="10" fill="#12F3D5"/>
    <circle cx="29" cy="79" r="8" fill="#12F3D5"/>
    <circle cx="76" cy="26" r="7" fill="#22D3EE"/>
    <circle cx="76" cy="70" r="7" fill="#12F3D5"/>
  </g>
  <text x="104" y="63" fill="#F8FBFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="850" letter-spacing="0">Credit</text>
  <text x="244" y="63" fill="url(#trustGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="850" letter-spacing="0">Trust</text>
</svg>
