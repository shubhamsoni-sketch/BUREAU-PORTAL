<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="creditTrustLogoTitle creditTrustLogoDesc">
  <title id="creditTrustLogoTitle">Credit Trust</title>
  <desc id="creditTrustLogoDesc">Credit Trust logo with circular trust mark and Verify Analyze Empower tagline.</desc>
  <defs>
    <linearGradient id="markGradient" x1="18" y1="24" x2="142" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12F3D5"/>
      <stop offset="1" stop-color="#1188FF"/>
    </linearGradient>
    <linearGradient id="trustGradient" x1="356" y1="45" x2="575" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12F3D5"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.071 0 0 0 0 0.953 0 0 0 0 0.835 0 0 0 0.38 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <path d="M82 25C112.4 25 137 49.6 137 80C137 110.4 112.4 135 82 135C51.6 135 27 110.4 27 80C27 49.6 51.6 25 82 25Z" stroke="url(#markGradient)" stroke-width="7" stroke-linecap="round" stroke-dasharray="82 22 40 16 66 20"/>
    <circle cx="82" cy="25" r="13" fill="#12F3D5"/>
    <circle cx="32" cy="80" r="15" fill="#12F3D5"/>
    <circle cx="54" cy="124" r="12" fill="#12F3D5"/>
    <circle cx="123" cy="48" r="10" fill="#22D3EE"/>
    <circle cx="122" cy="112" r="10" fill="#12F3D5"/>
    <circle cx="82" cy="135" r="8" fill="#22D3EE"/>
  </g>
  <text x="165" y="84" fill="#EEF7FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Credit</text>
  <text x="356" y="84" fill="url(#trustGradient)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="0">Trust</text>
  <text x="168" y="125" fill="#C8D8E8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600" letter-spacing="0">Verify. Analyze. Empower.</text>
</svg>
